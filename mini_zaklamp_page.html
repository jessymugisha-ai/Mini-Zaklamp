<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Zaklamp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
            font-size: 16px;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #e91e63;
            margin: 15px 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mini Zaklamp</h1>
        <img src="https://via.placeholder.com/300x200.png?text=Mini+Zaklamp" alt="Mini Zaklamp">
        <p>Kleine, krachtige LED-zaklamp. Compact, lichtgewicht en handig voor dagelijks gebruik.</p>
        <div class="price">€4,99</div>
        <a href="#" class="btn">Koop nu</a>
    </div>
</body>
</html>
